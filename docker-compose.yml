services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/usermanagement
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=ihXTf3Is38snDc4TjH0SGUq7e0uyJVVKwqiSI8FbtXW
      - NODE_ENV=development
    depends_on:
      - mongodb

  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
